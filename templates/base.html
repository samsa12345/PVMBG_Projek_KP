<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Volcano Monitoring System{% endblock %}</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{{ url_for('dashboard') }}" class="navbar-brand">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="navbar-logo" onerror="this.src='/logo/images.png'">
                <span>VOLCANO MONITORING</span>
            </a>
            <ul class="navbar-links">
                <li><a href="{{ url_for('dashboard') }}" class="nav-link {% if page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
                <li><a href="{{ url_for('lewotolok') }}" class="nav-link {% if page == 'lewotolok' %}active{% endif %}">Lewotolok</a></li>
                <li><a href="{{ url_for('tangkuban') }}" class="nav-link {% if page == 'tangkuban' %}active{% endif %}">Tangkuban Perahu</a></li>
                <li><a href="{{ url_for('riwayat') }}" class="nav-link {% if page == 'riwayat' %}active{% endif %}">Riwayat</a></li>
                <li><a href="{{ url_for('tentang') }}" class="nav-link {% if page == 'tentang' %}active{% endif %}">Tentang</a></li>
            </ul>
        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Volcano Monitoring System — Sistem Monitoring Kondisi Gunung Api Berbasis Citra CCTV</p>
        </div>
    </footer>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
